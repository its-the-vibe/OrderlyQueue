services:
  orderly-queue:
    image: ghcr.io/its-the-vibe/orderlyqueue:latest
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT}:8080"
    read_only: true
    env_file:
      - .env
    volumes:
      - ./config/config.yaml:/config/config.yaml:ro    
    restart: on-failure:10
    extra_hosts:
      - "host.docker.internal:host-gateway"    
